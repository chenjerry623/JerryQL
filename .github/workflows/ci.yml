name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: asan-ubsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DJERRYQL_SANITIZE=ON
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DJERRYQL_WERROR=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure
      - name: Randomized engine test, 100 seeds
        run: for s in $(seq 1 100); do JERRYQL_SEED=$s ./build/jerryql_tests randomized > /dev/null || exit 1; done
      - name: Randomized B+tree test, 20 seeds
        run: for s in $(seq 1 20); do JERRYQL_SEED=$s ./build/jerryql_tests btreeRandomized > /dev/null || exit 1; done

  wasm:
    runs-on: ubuntu-latest
    name: webassembly
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Build site
        run: bash web/build_site.sh
      - name: Smoke-test the WebAssembly build in Node
        run: node web/smoke_test.cjs build-web/jerryql.js
